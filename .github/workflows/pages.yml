name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _pages
          cp index.html chatbot.js PLANNING.md lesson.html wiki.md wiki.html _config.yml wiki.css _pages/
          cp -R _layouts lesson _pages/

      - name: Render Markdown with GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
