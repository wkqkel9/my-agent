services:
  - type: web
    name: typing-agent
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: nvidia/nemotron-3-8b-instruct
