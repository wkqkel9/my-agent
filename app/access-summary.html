<main class="writing-main"><header class="writing-heading"><div class="eyebrow">PBL 04 · ACCESS SUMMARY</div><h1>영작·필사 접근 집계</h1><p>로그인한 계정의 연습 권한 확인 결과를 집계합니다. 기록은 계정별로 제한됩니다.</p></header>
