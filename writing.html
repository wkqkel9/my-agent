<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f8f5"><meta name="description" content="한글의 뜻을 영어로 쓰고, 짧은 피드백을 받으며 문장을 넓혀가는 영작 연습."><title>영작 — typing</title><link rel="stylesheet" href="./site.css"><script src="./writing.js" defer></script></head>
<body><div class="wrap"><nav aria-label="주 메뉴"><a class="brand" href="./index.html" aria-label="typing 홈"><span class="symbol" aria-hidden="true"><i></i><i></i><i></i></span>typing</a><div class="links"><a href="./index.html">소개</a><a href="./writing.html" aria-current="page">영작</a><a href="./index.html#copywriting">필사</a><a href="./docs.html">Docs</a></div></nav>
<main class="writing-main"><header class="writing-heading"><div class="eyebrow">Writing practice</div><h1>한 문장씩,<br>내 영어로.</h1><p>한글의 뜻을 영어로 써보세요.<br>짧은 문장에 표현을 더하며, 나만의 문장을 완성해요.</p></header>
<section class="writing-workspace" aria-label="영작 연습"><div class="writing-meta"><span class="writing-topic">일상 습관 · 책 읽기</span><span>4단계 · 문장마다 60초</span></div><div class="demo"><div class="demo-head"><span>영작 연습</span><span class="clock" id="clock" role="timer" aria-label="이 문장 남은 시간 60초" data-phase="normal" data-running="false"><span id="clockSeconds" aria-hidden="true">60</span></span></div><div class="prompt">아래 한글 문장을 영어로 써보세요.</div><div class="korean-prompt" id="koreanPrompt">나는 책을 읽는다.</div><div class="round-label" id="roundLabel">01 / 04</div><form id="expandForm"><div class="expand-surface" id="expandSurface"><div id="expandHighlight" aria-hidden="true"></div><textarea id="expandInput" aria-label="한글 문장을 영어로 쓰기" aria-describedby="expansionFeedback expandStatus" placeholder="여기를 누르면 60초 연습이 시작돼요." enterkeyhint="send" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" maxlength="500" rows="3"></textarea></div><div class="expansion-feedback-slot"><section id="expansionFeedback" class="answer-feedback" aria-label="영작 피드백" aria-live="polite" hidden><strong id="feedbackTitle"></strong><span id="feedbackReason"></span></section></div><span class="status" id="expandStatus" role="status">입력창을 눌러 시작 · Enter로 확인</span></form></div></section>
<p class="writing-help">고칠 부분은 한 번에 하나씩 알려드려요. 수정한 뒤 Enter로 다시 확인하세요.<br><a href="./index.html#features">연습 방법과 데모 보기</a></p></main><footer><span class="footer-brand">typing</span><span>작은 문장이 쌓이는 곳.</span><span>© 2026 typing</span></footer></div></body></html>
